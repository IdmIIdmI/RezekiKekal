
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARENA LEGENDS 2D</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#101b20;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;background:#426b45}
#hud{position:fixed;top:8px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;font-size:13px;font-weight:bold;text-shadow:1px 2px 3px #000}
.panel{background:#10242ddd;border:1px solid #ffffff44;border-radius:10px;padding:8px}
#heroInfo{min-width:130px}
#health{height:9px;background:#542c2c;border-radius:9px;margin-top:5px;overflow:hidden}
#healthFill{height:100%;background:#35e77b;width:100%}
#controls{position:fixed;bottom:15px;left:0;width:100%;display:flex;justify-content:space-between;align-items:end;padding:0 20px}
#joy{width:112px;height:112px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff66;position:relative}
#knob{position:absolute;width:42px;height:42px;border-radius:50%;background:#ffffffaa;left:33px;top:33px}
.skills{display:flex;gap:9px;align-items:end}
.skill{width:57px;height:57px;border-radius:50%;border:2px solid #e7c66b;background:#243c55;color:white;font-weight:bold;font-size:12px;box-shadow:0 3px 8px #0008}
.skill:active{background:#b77b26}
#attack{width:69px;height:69px;background:#a72d32;border:3px solid #ffc2a0}
#skill3{width:64px;height:64px;background:#6544a5}
#heroSelect{position:fixed;inset:0;background:#08131af2;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:15px}
#heroSelect h1{color:#f6d46b;text-align:center;font-size:27px;margin:5px}
#heroSelect p{color:#c4d2d9;text-align:center}
.heroes{display:grid;grid-template-columns:repeat(3,minmax(85px,115px));gap:10px}
.pick{padding:13px 5px;border:1px solid #718b9b;border-radius:12px;background:#193344;color:white;font-weight:bold}
.pick span{display:block;font-size:28px;margin-bottom:5px}
#start{margin-top:18px;padding:14px 45px;background:#d9a83d;color:#18232a;border:0;border-radius:10px;font-weight:bold;font-size:17px}
#message{position:fixed;top:42%;width:100%;text-align:center;font-size:30px;font-weight:bold;text-shadow:2px 3px 5px black;pointer-events:none}
#help{position:fixed;top:55px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff9;text-align:center;pointer-events:none}
@media(orientation:portrait){#help:after{content:" • Pusing telefon ke LANDSKAP untuk pengalaman terbaik"}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel" id="heroInfo">
  <div id="heroName">HERO</div>
  <div id="health"><div id="healthFill"></div></div>
  <div id="stats">LV 1 | GOLD 0</div>
 </div>
 <div class="panel" id="score">BLUE 0 - 0 RED</div>
 <div class="panel" id="timer">00:00</div>
</div>

<div id="help">JOYSTICK: GERAK • A: SERANG • B: SKILL • C: DASH • U: ULTIMATE</div>
<div id="message"></div>

<div id="controls">
 <div id="joy"><div id="knob"></div></div>
 <div class="skills">
  <button class="skill" id="skill3">ULT<br>U</button>
  <button class="skill" id="skill2">DASH<br>C</button>
  <button class="skill" id="skill1">SKILL<br>B</button>
  <button class="skill" id="attack">⚔<br>ATK</button>
 </div>
</div>

<div id="heroSelect">
 <h1>⚔ ARENA LEGENDS</h1>
 <p>Pilih wira untuk memasuki arena pertempuran</p>
 <div class="heroes" id="heroes"></div>
 <button id="start">MULA BERTEMPUR</button>
 <p style="font-size:11px">2D MOBA • 3 LANE • AI BATTLE</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=1000,H=600,scale=1;
function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 W=1000;H=600;
 scale=Math.min(canvas.width/W,canvas.height/H);
}
addEventListener("resize",resize);resize();

const heroes=[
 {name:"KNIGHT",emoji:"🛡️",hp:180,speed:2.5,damage:18,color:"#54b9ff"},
 {name:"ASSASSIN",emoji:"🥷",hp:105,speed:4,damage:25,color:"#b18cff"},
 {name:"TANK",emoji:"⚔️",hp:260,speed:1.8,damage:13,color:"#e4bd67"},
 {name:"ARCHER",emoji:"🏹",hp:120,speed:2.8,damage:22,color:"#69d68b"},
 {name:"MAGE",emoji:"🧙",hp:110,speed:2.5,damage:30,color:"#ed82e7"},
 {name:"WARRIOR",emoji:"🪓",hp:200,speed:2.4,damage:20,color:"#ff9862"}
];
let chosen=0,started=false,ended=false;
let player,enemies=[],minions=[],towers=[],projectiles=[];
let kills=0,gold=0,level=1,elapsed=0,lastSpawn=0,lastTime=0;
let joy={x:0,y:0,active:false};
let keys={};
let cooldown={b:0,c:0,u:0,a:0};

const lanes=[150,300,450];

document.getElementById("heroes").innerHTML=heroes.map((h,i)=>
 `<button class="pick" data-i="${i}"><span>${h.emoji}</span>${h.name}</button>`
).join("");

document.querySelectorAll(".pick").forEach(b=>{
 b.onclick=()=>{
  chosen=+b.dataset.i;
  document.querySelectorAll(".pick").forEach(x=>x.style.borderColor="#718b9b");
  b.style.borderColor="#ffd45d";
 };
});
document.querySelector(".pick").style.borderColor="#ffd45d";

function makeHero(team,type,x,y){
 let h=heroes[type];
 return {
  team,type,x,y,hp:h.hp,maxHp:h.hp,speed:h.speed,
  damage:h.damage,range:115,alive:true,level:1,
  attackTimer:0,respawn:0,flash:0
 };
}

function startGame(){
 player=makeHero(0,chosen,100,300);
 enemies=[makeHero(1,1,880,300)];
 enemies[0].ai=true;
 towers=[];
 for(let lane of lanes){
  towers.push({team:0,x:235,y:lane,hp:260,max:260,lane});
  towers.push({team:1,x:765,y:lane,hp:260,max:260,lane});
 }
 minions=[];projectiles=[];
 kills=0;gold=0;level=1;elapsed=0;
 started=true;ended=false;
 document.getElementById("heroSelect").style.display="none";
 document.getElementById("message").textContent="";
 lastTime=performance.now();
}

document.getElementById("start").onclick=startGame;

function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function nearest(x,team,range){
 let all=[...minions,...enemies,...(player?[player]:[]) ,...towers];
 return all.filter(o=>o!==x&&o.team!==team&&o.hp>0&&distance(x,o)<range)
 .sort((a,b)=>distance(x,a)-distance(x,b))[0];
}
function damage(target,n,team){
 if(!target||target.hp<=0)return;
 target.hp-=n;
 target.flash=.12;
 if(target.hp<=0){
  target.hp=0;
  if(target.team===1&&team===0){
   kills++;gold+=35;
   if(gold>=100){gold-=100;level++;player.maxHp+=12;player.hp=Math.min(player.maxHp,player.hp+25);player.damage+=3;}
  }
  if(target===player){
   player.alive=false;player.respawn=3;
  }
 }
}

function spawnMinions(){
 for(let lane of lanes){
  for(let team=0;team<2;team++){
   minions.push({
    team,x:team===0?100:900,y:lane+(Math.random()*16-8),
    hp:65,maxHp:65,damage:7,speed:0.7,attackTimer:0,lane
   });
  }
 }
}

function moveToward(o,target,speed){
 let dx=target.x-o.x,dy=target.y-o.y;
 let d=Math.hypot(dx,dy)||1;
 o.x+=dx/d*speed;o.y+=dy/d*speed;
}

function fire(x,y,target,team,damageAmount,speed=5){
 if(!target)return;
 let d=distance({x,y},target)||1;
 projectiles.push({
  x,y,vx:(target.x-x)/d*speed,
  vy:(target.y-y)/d*speed,target,team,damage:damageAmount,life:1
 });
}

function update(dt){
 if(!started||ended)return;
 elapsed+=dt;
 cooldown.b=Math.max(0,cooldown.b-dt);
 cooldown.c=Math.max(0,cooldown.c-dt);
 cooldown.u=Math.max(0,cooldown.u-dt);
 cooldown.a=Math.max(0,cooldown.a-dt);

 if(elapsed-lastSpawn>8){spawnMinions();lastSpawn=elapsed;}

 if(player.alive){
  let dx=joy.x,dy=joy.y;
  if(keys.ArrowLeft||keys.a)dx-=1;
  if(keys.ArrowRight||keys.d)dx+=1;
  if(keys.ArrowUp||keys.w)dy-=1;
  if(keys.ArrowDown||keys.s)dy+=1;
  let len=Math.hypot(dx,dy);
  if(len>1){dx/=len;dy/=len;}
  player.x=clamp(player.x+dx*player.speed*dt*60,20,980);
  player.y=clamp(player.y+dy*player.speed*dt*60,80,520);

  player.attackTimer-=dt;
  if(player.attackTimer<=0){
   let target=nearest(player,0,player.range);
   if(target){
    fire(player.x,player.y,target,0,player.damage);
    player.attackTimer=.65;
   }
  }
 }else{
  player.respawn-=dt;
  if(player.respawn<=0){
   player.alive=true;player.hp=player.maxHp;
   player.x=100;player.y=300;
  }
 }

 // AI HERO
 enemies.forEach(e=>{
  if(e.hp<=0){
   e.respawn=(e.respawn||0)+dt;
   if(e.respawn>4){e.hp=e.maxHp;e.x=880;e.y=300;e.respawn=0;}
   return;
  }
  let target=player.alive?player:minions.find(m=>m.team===0);
  if(target&&distance(e,target)>95)moveToward(e,target,e.speed*dt*60);
  e.attackTimer-=dt;
  if(target&&distance(e,target)<130&&e.attackTimer<=0){
   fire(e.x,e.y,target,1,e.damage);
   e.attackTimer=1;
  }
 });

 // MINIONS
 minions.forEach(m=>{
  if(m.hp<=0)return;
  let target=nearest(m,m.team,45);
  if(target){
   m.attackTimer-=dt;
   if(m.attackTimer<=0){
    damage(target,m.damage,m.team);
    m.attackTimer=1;
   }
  }else{
   let direction=m.team===0?1:-1;
   let tower=towers.find(t=>t.team!==m.team&&t.hp>0&&Math.abs(t.y-m.lane)<30&&Math.abs(t.x-m.x)<100);
   let baseX=m.team===0?940:60;
   if(tower){
    if(Math.abs(tower.x-m.x)>28)m.x+=direction*m.speed*dt*60;
    else {m.attackTimer-=dt;if(m.attackTimer<=0){damage(tower,m.damage,m.team);m.attackTimer=1;}}
   }else{
    let tx=baseX;
    if(Math.abs(tx-m.x)>20)m.x+=direction*m.speed*dt*60;
   }
  }
 });

 // TOWERS
 towers.forEach(t=>{
  if(t.hp<=0)return;
  t.timer=(t.timer||0)-dt;
  let target=[...minions,...enemies,...(player?[player]:[])]
   .filter(o=>o.hp>0&&o.team!==t.team&&distance(t,o)<155)
   .sort((a,b)=>distance(t,a)-distance(t,b))[0];
  if(target&&t.timer<=0){
   fire(t.x,t.y,target,t.team,15,7);
   t.timer=1.2;
  }
 });

 // PROJECTILES
 projectiles.forEach(p=>{
  if(!p.target||p.target.hp<=0){p.life=0;return;}
  p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
  p.life-=dt;
  if(distance(p,p.target)<15){
   damage(p.target,p.damage,p.team);p.life=0;
  }
 });
 projectiles=projectiles.filter(p=>p.life>0);
 minions=minions.filter(m=>m.hp>0&&m.x>-30&&m.x<1030);

 // BASES
 let blueTower=towers.filter(t=>t.team===0).every(t=>t.hp<=0);
 let redTower=towers.filter(t=>t.team===1).every(t=>t.hp<=0);
 if(blueTower&&redTower===false&&minions.some(m=>m.team===0&&m.x>900)){
  // Base remains protected until towers are destroyed
 }
 if(towers.filter(t=>t.team===1).every(t=>t.hp<=0)){
  let m=minions.find(m=>m.team===0&&m.x>920);
  if(m){endGame("BLUE MENANG!");return;}
 }
 if(towers.filter(t=>t.team===0).every(t=>t.hp<=0)){
  let m=minions.find(m=>m.team===1&&m.x<80);
  if(m){endGame("RED MENANG!");return;}
 }

 document.getElementById("healthFill").style.width=
  (player.hp/player.maxHp*100)+"%";
 document.getElementById("heroName").textContent=
  heroes[player.type].emoji+" "+heroes[player.type].name;
 document.getElementById("stats").textContent=
  "LV "+level+" | GOLD "+gold+" | KILL "+kills;
 document.getElementById("score").textContent=
  "BLUE "+kills+" - "+enemies.filter(e=>e.hp<=0).length+" RED";
 document.getElementById("timer").textContent=
  String(Math.floor(elapsed/60)).padStart(2,"0")+":"+
  String(Math.floor(elapsed%60)).padStart(2,"0");
}

function endGame(msg){
 ended=true;
 document.getElementById("message").innerHTML=
  msg+"<br><button onclick='location.reload()' style='padding:12px;margin-top:15px'>MAIN SEMULA</button>";
}

function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function bar(x,y,w,h,hp,max,color){
 ctx.fillStyle="#251e20";ctx.fillRect(x-w/2,y,w,h);
 ctx.fillStyle=color;ctx.fillRect(x-w/2,y,w*clamp(hp/max,0,1),h);
}

function draw(){
 ctx.setTransform(scale,0,0,scale,
  (canvas.width-W*scale)/2,(canvas.height-H*scale)/2);
 ctx.clearRect(0,0,W,H);

 // MAP
 ctx.fillStyle="#477b49";ctx.fillRect(0,0,W,H);
 // Jungle zones
 ctx.fillStyle="#355f3d";
 for(let x=0;x<W;x+=80){
  ctx.fillRect(x,55,40,30);
  ctx.fillRect(x,515,40,30);
 }
 // Lane paths
 lanes.forEach(y=>{
  ctx.fillStyle="#b49a70";ctx.fillRect(0,y-25,W,50);
  ctx.fillStyle="#c9b28b";ctx.fillRect(0,y-2,W,4);
 });
 // Mid jungle dividers
 ctx.fillStyle="#315c39";
 ctx.fillRect(0,225,W,30);ctx.fillRect(0,375,W,30);

 // Base
 circle(55,300,43,"#287ac9");
 circle(55,300,25,"#66c8ff");
 circle(945,300,43,"#bd3434");
 circle(945,300,25,"#ff9d62");
 ctx.fillStyle="white";ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.fillText("BLUE BASE",55,360);ctx.fillText("RED BASE",945,360);

 // Towers
 towers.forEach(t=>{
  if(t.hp<=0)return;
  circle(t.x,t.y,19,t.team===0?"#318bd8":"#d94b4b");
  circle(t.x,t.y,10,"#e7d8a0");
  bar(t.x,t.y-29,42,5,t.hp,t.max,"#65ed91");
 });

 // Minions
 minions.forEach(m=>{
  circle(m.x,m.y,8,m.team===0?"#72caff":"#ff8c83");
  bar(m.x,m.y-14,20,3,m.hp,m.maxHp,"#73ed88");
 });

 // Projectiles
 projectiles.forEach(p=>{
  circle(p.x,p.y,5,p.team===0?"#9ceaff":"#ffb36a");
 });

 // Enemy heroes
 enemies.forEach(e=>{
  if(e.hp<=0)return;
  circle(e.x,e.y,17,"#ff4444");
  circle(e.x,e.y,11,"#ffb6a0");
  ctx.fillStyle="#fff";ctx.font="18px Arial";
  ctx.fillText(heroes[e.type].emoji,e.x,e.y+6);
  bar(e.x,e.y-28,42,5,e.hp,e.maxHp,"#ff5757");
 });

 // Player
 if(player&&player.alive){
  circle(player.x,player.y,23,"#268fe0");
  circle(player.x,player.y,17,heroes[player.type].color);
  ctx.font="22px Arial";ctx.textAlign="center";
  ctx.fillText(heroes[player.type].emoji,player.x,player.y+8);
  bar(player.x,player.y-32,48,6,player.hp,player.maxHp,"#42f28b");
 }
 ctx.setTransform(1,0,0,1,0,0);
}

function loop(now){
 let dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;
 update(dt);draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// KEYBOARD
addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key==="j"||e.key===" ")attack();
 if(e.key==="k")skillB();
 if(e.key==="l")dash();
 if(e.key==="u")ultimate();
});
addEventListener("keyup",e=>keys[e.key]=false);

// JOYSTICK
const joyEl=document.getElementById("joy");
const knob=document.getElementById("knob");
function joyMove(e){
 let r=joyEl.getBoundingClientRect();
 let cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 let len=Math.hypot(dx,dy),max=37;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.left=(33+dx)+"px";
 knob.style.top=(33+dy)+"px";
}
joyEl.addEventListener("pointerdown",e=>{
 joy.active=true;joyEl.setPointerCapture(e.pointerId);joyMove(e);
});
joyEl.addEventListener("pointermove",e=>{if(joy.active)joyMove(e);});
function stopJoy(){
 joy.active=false;joy.x=0;joy.y=0;
 knob.style.left="33px";knob.style.top="33px";
}
joyEl.addEventListener("pointerup",stopJoy);
joyEl.addEventListener("pointercancel",stopJoy);

// SKILLS
function attack(){
 if(!started||!player.alive||cooldown.a>0)return;
 let t=nearest(player,0,180);
 if(t){fire(player.x,player.y,t,0,player.damage*1.5,8);cooldown.a=.35;}
}
function skillB(){
 if(!started||!player.alive||cooldown.b>0)return;
 let targets=[...enemies,...minions].filter(e=>e.hp>0&&e.team===1&&distance(player,e)<190);
 targets.forEach(t=>damage(t,player.damage*2,0));
 cooldown.b=5;
}
function dash(){
 if(!started||!player.alive||cooldown.c>0)return;
 let dx=joy.x,dy=joy.y;
 if(!dx&&!dy)dx=1;
 player.x=clamp(player.x+dx*105,20,980);
 player.y=clamp(player.y+dy*105,80,520);
 cooldown.c=4;
}
function ultimate(){
 if(!started||!player.alive||cooldown.u>0)return;
 [...enemies,...minions].filter(e=>e.hp>0&&e.team===1&&distance(player,e)<230)
 .forEach(t=>damage(t,player.damage*4,0));
 cooldown.u=15;
}
document.getElementById("attack").onclick=attack;
document.getElementById("skill1").onclick=skillB;
document.getElementById("skill2").onclick=dash;
document.getElementById("skill3").onclick=ultimate;
</script>
</body>
</html>
